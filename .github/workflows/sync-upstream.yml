name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/asgeirtj/system_prompts_leaks.git || true
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge upstream/main -m "chore(sync): merge latest upstream system prompts" || true

      - name: Push updates
        run: |
          git push origin main || echo "No new upstream commits to push."
