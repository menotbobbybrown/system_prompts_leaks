<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with deep obsidian gradient -->
  <rect width="1200" height="400" rx="16" fill="#0B0D14"/>
  <rect width="1200" height="400" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  
  <!-- Subtle Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#6366F1" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="300" r="200" fill="#06B6D4" fill-opacity="0.1" filter="blur(90px)"/>
  <circle cx="600" cy="200" r="150" fill="#10B981" fill-opacity="0.08" filter="blur(70px)"/>

  <!-- Main Vector Icon Emblem -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#131622" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <path d="M30 40H90M30 60H70M30 80H80" stroke="url(#bannerGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="85" cy="80" r="6" fill="#06B6D4"/>
  </g>

  <!-- Typography -->
  <text x="250" y="180" fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">
    System Prompts as MCP
  </text>
  <text x="250" y="225" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="20" font-weight="500">
    Universal Model Context Protocol (MCP) Server for 100+ Frontier AI Personas
  </text>

  <!-- Tag Pills -->
  <g transform="translate(250, 255)">
    <!-- Pill 1: Daily Sync -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="14" y="21" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">● Daily Upstream Sync</text>

    <!-- Pill 2: MCP Native -->
    <rect x="180" y="0" width="145" height="32" rx="16" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1"/>
    <text x="194" y="21" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">⚡ MCP Native Server</text>

    <!-- Pill 3: 100+ Models -->
    <rect x="340" y="0" width="180" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
    <text x="354" y="21" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">📚 Anthropic, Cursor, o3</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
</svg>
